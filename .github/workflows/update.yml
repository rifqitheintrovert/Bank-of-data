name: Update Bank of Data

on:
  schedule:
    # Waktu dalam UTC (WIB = UTC+7). GitHub bisa telat 5-20 menit saat ramai.
    - cron: "7,37 2-9 * * 1-5"    # tiap 30 menit, 09:07-16:37 WIB, Senin-Jumat (jam bursa BEI)
    - cron: "17 11-23/2 * * *"    # tiap 2 jam di luar jam BEI (sesi AS, kripto, komoditas)
    - cron: "17 0 * * *"          # 07:17 WIB, sebelum BEI buka
    - cron: "0 1 * * 0"           # Minggu: keepalive (cegah jadwal dimatikan GitHub setelah 60 hari tanpa commit)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/**", "site/**", "requirements.txt", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.schedule != '0 1 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache fundamental, berita, dan hasil sumber terakhir
        uses: actions/cache@v4
        with:
          path: |
            .cache
            ~/.cache/py-yfinance
          key: bod-data-${{ github.run_id }}
          restore-keys: bod-data-
      - name: Ambil data dan tulis site/data
        run: python -m engine.build --out site/data --cache .cache
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    if: github.event.schedule == '0 1 * * 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git config user.name "bod-bot"
          git config user.email "bod-bot@users.noreply.github.com"
          date -u +%FT%TZ > .github/keepalive
          git add .github/keepalive
          git commit -m "keepalive" && git push || true
