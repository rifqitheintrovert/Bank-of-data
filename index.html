<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank of Data Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/terminal.css">
</head>
<body>
<header class="top">
  <div class="brand">BANK OF DATA</div>
  <form class="cmdwrap" id="cmdform" autocomplete="off">
    <span class="prompt" id="prompt">1</span>
    <input id="cmd" spellcheck="false" placeholder="mis. BBCA GP   |   WEI   |   ECO   |   HELP" list="cmdlist">
    <button type="submit" class="go">GO</button>
  </form>
  <div class="layoutbtns" id="layouts">
    <button data-l="1" title="1 panel">▭</button><button data-l="2" title="2 panel">▯▯</button><button data-l="4" title="4 panel">▦</button>
  </div>
  <div class="clocks" id="clocks"></div>
</header>
<div class="fkeys" id="fkeys"></div>
<main class="panes l4" id="panes"></main>
<footer class="bot">
  <div class="status" id="status"></div>
  <div class="tape"><div class="tapein" id="tape"></div></div>
</footer>
<div class="toasts" id="toasts"></div>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/funcs1.js"></script>
<script src="js/funcs2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
